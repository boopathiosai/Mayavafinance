<script>
$(document).ready(function(){
$('#cus_id').focus();
$("input").not( $(":button,:hidden") ).keypress(function (evt) {
            if (evt.keyCode == 13) {
                iname = $(this).val();
                if (iname !== 'Submit'){    
                    var fields = $(this).parents('form:eq(0),body').find('input:text');                 
                    
                    var index = fields.index( this );
                    if ( index > -1 && ( index + 1 ) < fields.length) {
                        fields.eq( index + 1 ).focus();
                    }
                    else
                    {                   
                      search_customer();
                    }
                    return false;
                }
            }
        });

});
