<script type="text/javascript">
    $(document).ready(function(){   
        
        // focus the first field..
        $("input[name=pval[category]]").focus();

        $("input,select").not( $(":button,:hidden") ).keypress(function (evt) {
            if (evt.keyCode == 13) {
                iname = $(this).val();
                if (iname !== 'Submit'){    
                    var fields = $(this).parents('form:eq(0),body').find('button,input:text,textarea,input:radio,input:checkbox,select');                    
                    
                    var index = fields.index( this );
                    if ( index > -1 && ( index + 1 ) < fields.length) {
                        fields.eq( index + 1 ).focus();
                    }
                    else
                    {                   
                      category_process('content_div','<?php echo $uval[id]; ?>','<?php echo $page_no; ?>','<?php echo $search_args; ?>');
                    }
                    return false;
                }
            }
        });
    });
</script>
