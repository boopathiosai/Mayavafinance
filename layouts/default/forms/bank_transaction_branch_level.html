<script type="text/javascript">

var flag = <?php echo $_SESSION['session_usertype']; ?>;

$(document).ready(function(){  
	
    if($("#transf_mode1").val() == 'cash'){
        $(".cheque_details_div").hide();
    }
    $("input,select").not( $(":button,:hidden") ).keypress(function (evt) {
        if (evt.keyCode == 13) {
            iname = $(this).val();
            if (iname !== 'Submit'){    
                var fields = $(this).parents('form:eq(0),body').find('button,input:text,input:radio,input:checkbox,textarea,select');                   

                var index = fields.index( this );
                if ( index > -1 && ( index + 1 ) < fields.length) {
                    fields.eq( index + 1 ).focus();
                }
                else
                {                   
                  customer_process('content_div','<?php echo $uval[id]; ?>','<?php echo $page_no; ?>','<?php echo $search_args; ?>');
                }
                return false;
            }
        }
    });

    enable_save_action();
    $("#postal_code_input").numeric();
	$("#contact_no_input").numeric({allow:"+-"});

    set_date_picker();
});

function cheque_details_show(opt)
{
    $(".cheque_details_div").hide();
    if(opt.value != 'cash'){
      if($("#cheque_details1").val() == ""){
        $("#cheque_details1").val($("#old_chq_det").val()); 
      }
      $(".cheque_details_div").show();
    }else{
      $("#old_chq_det").val($("#cheque_details1").val());
      $("#cheque_details1").val("");      
    }
}

jQuery(document).ready(function() {

    }
    $("input").focus(function(event){ remove_red(this.id); });
    
    collapse_all_view();
    setTotalAmount();
});
</script>
