<script type="text/javascript">
    $(document).ready(function(){   
        $("input,select").not( $(":button,:hidden") ).keypress(function (evt) {
            if (evt.keyCode == 13) {
                iname = $(this).val();
                if (iname !== 'Submit'){    
                    var fields = $(this).parents('form:eq(0),body').find('button,input:text,input:radio,input:checkbox,textarea,select,input:password');                    
                    
                    var index = fields.index( this );
                    if ( index > -1 && ( index + 1 ) < fields.length) {
                        fields.eq( index + 1 ).focus();
                    }
                    else
                    {                   
                      update_myaccount('msg','<?php echo $user_data['id']; ?>');
                    }
                    return false;
                }
            }
        });
        enable_save_action();
    });
</script>
