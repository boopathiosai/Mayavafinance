<?php
/*
 * SMS Reminder UI - MOCK ONLY (see sms/08_SMS_UI_SPECIFICATION.md)
 * ---------------------------------------------------------------
 * - Pure front-end markup/CSS/JS. No PHP logic, no DB access, no AJAX/fetch/XHR.
 * - Does NOT call sms::sendData() or any SMS provider. No message is ever sent.
 * - All rows are generated sample data (fake loan ids, fake names, fake
 *   0000-series mobile numbers, fake template ids) and are labelled MOCK in the UI.
 * - Included once from layouts/default/summary_reports_stock_report.html.
 *   It may be re-included when the report tab reloads via AJAX, so the script
 *   keeps state on window.MfSmsMock and re-binds idempotently.
 */

.sms-pager a.sms-active { background: #7a1c7d; color: #fff !important; font-weight: bold; }
.sms-pager a.sms-disabled { color: #c9b3ca !important; cursor: default; }
.sms-pager span { color: #555; }
.sms-closerow { text-align: right; margin-top: 8px; }
.sms-closebtn { display: inline-block; font-weight: bold; font-size: 14px; padding: 9px 30px; border: 1px solid #ccc; border-radius: 4px; background: #eee; color: #222 !important; text-decoration: none; cursor: pointer; }

    .sms-filters { grid-template-columns: auto 1fr; }

    .sms-foot .sms-pageof { text-align: center; }
}

    .sms-filters { grid-template-columns: 1fr; }
    .sms-filters label { text-align: left; }
    .sms-exports { justify-content: stretch; }

}
</style>

<script type="text/javascript">
(function ($) {
    "use strict";

    // State survives re-inclusion of this partial (report tabs reload via AJAX).
    var S = window.MfSmsMock = window.MfSmsMock || { initiated: false, rows: null, page: 1, filtered: null, seq: 0 };
    var PAGE_SIZE = 30;
    var STATUSES = ["Success", "Failed", "Pending"];
    var SVG_SEND = '<svg class="sms-btn-ico" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
    var SVG_HIST = '<svg class="sms-btn-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>';
    var SVG_XLS = '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" fill="#fff"/><path d="M7 8l5 8M12 8l-5 8" stroke="#0c7a43" stroke-width="2" fill="none"/></svg>';
    var SVG_PDF = '<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" fill="#fff"/><path d="M9 15h6M9 18h6M9 12h3" stroke="#e03131" stroke-width="1.6" fill="none"/></svg>';
    var SVG_SRCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>';

    // ---- MOCK DATA (generated; not read from the database) -------------------
    function seedRows() {
        var pre = ["POS", "POK", "POW", "POY"], names = ["Sample Customer A", "Sample Customer B", "Sample Customer C", "Sample Customer D", "Sample Customer E", "Sample Customer F", "Sample Customer G", "Sample Customer H"],
            bad = ["Invalid Mobile Number", "API Error (101)", "DND Number"], rows = [], i, t0 = new Date(2026, 8, 21, 10, 30, 0), failed;
        for (i = 0; i < 450; i++) {
            failed = (i % 4 === 2);
            S.seq += 1;
            rows.push({
                loan: "MOCK-" + pre[(i + (i >> 2)) % 4] + (29000 + i),
                name: names[i % names.length],
                mobile: "0000" + ("000000" + (i + 1)).slice(-6),
                tpl: "1000000000000000001",
                status: failed ? "Failed" : "Success",
                remarks: failed ? bad[(i >> 2) % bad.length] : "-",
                sent: new Date(t0.getTime() + i * 60000)
            });
        }
        return rows.reverse();
    }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function fmt(d) {
        var h = d.getHours(), ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) { h = 12; }
        return pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear() + " " + pad(h) + ":" + pad(d.getMinutes()) + " " + ap;
    }
    function esc(s) { return $("<div/>").text(s).html(); }

    // ---- Header buttons ------------------------------------------------------
    function refreshButtons() {
        var $h = $("#sms_history_btn"), $s = $("#sms_send_btn");
        if (!$s.data("iconed")) { $s.html(SVG_SEND + "Send Reminder").addClass("sms-btn-purple").data("iconed", 1); }
        if (!$h.data("iconed")) { $h.html(SVG_HIST + "History").data("iconed", 1); }
        if (S.initiated) {
            $h.removeClass("greybtn-off sms-btn-off").addClass("greybtn sms-btn-purple").removeAttr("aria-disabled").attr("title", "Open SMS Reminder History (mock data)");
        } else {
            $h.removeClass("greybtn sms-btn-purple").addClass("greybtn-off sms-btn-off").attr("aria-disabled", "true").attr("title", "Available after a reminder has been initiated");
        }
    }

    function sendReminder() {
        var $b = $("#sms_send_btn"), $f = $("#sms_mock_feedback");
        if ($b.data("busy")) { return; }
        $b.data("busy", true).css("opacity", 0.6);
        // History becomes available as soon as the action is initiated.
        S.initiated = true;
        if (!S.rows) { S.rows = seedRows(); }
        refreshButtons();
        $f.text("MOCK: reminder request in progress (simulated). No SMS is being sent.").show();
        window.setTimeout(function () {
            S.seq += 1;
            S.rows.unshift({ loan: "MOCK-NEW" + S.seq, name: "Sample Customer", mobile: "0000" + ("000000" + S.seq).slice(-6), tpl: "1000000000000000001", status: "Pending", remarks: "Queued by mock send action", sent: new Date() });
            $f.text("MOCK: simulated request recorded in History. No SMS was sent and no provider was contacted.");
            $b.data("busy", false).css("opacity", 1);
        }, 800);
    }

    // ---- History modal -------------------------------------------------------
    function modalHtml() {
        var opts = '<option value="">All</option>', i;
        for (i = 0; i < STATUSES.length; i++) { opts += '<option value="' + STATUSES[i] + '">' + STATUSES[i] + '</option>'; }
        return '' +
        '<div class="sms-mock-note"><strong>MOCK DATA</strong> &ndash; generated sample records for UI review. Nothing here reflects real SMS delivery.</div>' +
        '<div class="sms-exports"><a class="sms-xbtn sms-xbtn-xls" id="sms_f_xls">' + SVG_XLS + 'Excel</a><a class="sms-xbtn sms-xbtn-pdf" id="sms_f_pdf">' + SVG_PDF + 'PDF</a></div>' +
        '<form id="sms_hist_form" onsubmit="return false;" autocomplete="off"><div class="sms-filters">' +
          '<label for="sms_f_loan">Loan ID :</label><input type="text" id="sms_f_loan" maxlength="30" placeholder="Enter Loan ID">' +
          '<label for="sms_f_name">Customer Name :</label><input type="text" id="sms_f_name" maxlength="60" placeholder="Enter Customer Name">' +
          '<div class="sms-gsearch"><input type="text" id="sms_f_global" maxlength="60" placeholder="Search Loan ID, Customer Name or Mobile">' + SVG_SRCH + '</div>' +
          '<label for="sms_f_status">Status :</label><select id="sms_f_status">' + opts + '</select>' +
          '<label for="sms_f_mobile">Mobile No :</label><input type="text" id="sms_f_mobile" maxlength="15" placeholder="Enter Mobile Number">' +
          '<div class="sms-fbtns"><a id="sms_f_search" class="sms-fbtn-search">Search</a><a id="sms_f_reset" class="sms-fbtn-reset">Reset</a></div>' +
        '</div></form>' +
        '<div id="sms_hist_msg" class="sms-msg"></div>' +
        '<div class="sms-tbl-wrap"><table class="sms-tbl"><thead><tr>' +
          '<th>S.No</th><th>Loan ID</th><th>Customer Name</th><th>Mobile Number</th><th>Template ID</th><th>Status</th><th>Remarks</th><th>Sent Date</th>' +
        '</tr></thead><tbody id="sms_hist_body"></tbody></table></div>' +
        '<div class="sms-foot"><div class="sms-showing" id="sms_hist_showing"></div><div class="sms-pager" id="sms_hist_pager"></div><div class="sms-pageof" id="sms_hist_pageof"></div></div>' +
        '<div class="sms-closerow"><a class="sms-closebtn" id="sms_f_close">Close</a></div>';
    }

    function applyFilters() {
        var loan = $.trim($("#sms_f_loan").val()).toLowerCase(),
            name = $.trim($("#sms_f_name").val()).toLowerCase(),
            mob = $.trim($("#sms_f_mobile").val()),
            g = $.trim($("#sms_f_global").val()).toLowerCase(),
            st = $("#sms_f_status").val();
        S.filtered = $.grep(S.rows || [], function (r) {
            return (!loan || r.loan.toLowerCase().indexOf(loan) > -1) &&
                   (!name || r.name.toLowerCase().indexOf(name) > -1) &&
                   (!mob || r.mobile.indexOf(mob) > -1) &&
                   (!st || r.status === st) &&
                   (!g || r.loan.toLowerCase().indexOf(g) > -1 || r.name.toLowerCase().indexOf(g) > -1 || r.mobile.indexOf(g) > -1);
        });
        S.page = 1;
        render();
    }

    function pageList(cur, pages) {
        var out = [], i;
        if (pages <= 7) { for (i = 1; i <= pages; i++) { out.push(i); } return out; }
        out.push(1);
        if (cur <= 4) { out.push(2, 3, 4, "…"); }
        else if (cur >= pages - 3) { out.push("…", pages - 3, pages - 2, pages - 1); }
        else { out.push("…", cur - 1, cur, cur + 1, "…"); }
        out.push(pages);
        return out;
    }

    function render() {
        var rows = S.filtered || S.rows || [], total = rows.length,
            pages = Math.max(1, Math.ceil(total / PAGE_SIZE)), i, html = "", start, slice, pg = "", pl, a;
        if (S.page > pages) { S.page = pages; }
        start = (S.page - 1) * PAGE_SIZE;
        slice = rows.slice(start, start + PAGE_SIZE);
        if (!slice.length) { html = '<tr><td colspan="8" class="sms-empty">No records found</td></tr>'; }
        for (i = 0; i < slice.length; i++) {
            var r = slice[i];
            html += '<tr><td>' + (start + i + 1) + '</td><td>' + esc(r.loan) + '</td><td class="sms-left">' + esc(r.name) + '</td><td>' + esc(r.mobile) +
                '</td><td>' + esc(r.tpl) + '</td><td><span class="sms-badge sms-badge-' + r.status + '">' + r.status + '</span></td><td>' + esc(r.remarks) +
                '</td><td>' + fmt(r.sent) + '</td></tr>';
        }
        $("#sms_hist_body").html(html);

        pg += '<a data-p="1" title="First" class="' + (S.page <= 1 ? 'sms-disabled' : '') + '">&laquo;</a>';
        pg += '<a data-p="' + (S.page - 1) + '" title="Previous" class="' + (S.page <= 1 ? 'sms-disabled' : '') + '">&lsaquo;</a>';
        pl = pageList(S.page, pages);
        for (i = 0; i < pl.length; i++) {
            a = pl[i];
            pg += (a === "…") ? '<span>…</span>' : '<a data-p="' + a + '" class="' + (a === S.page ? 'sms-active' : '') + '">' + a + '</a>';
        }
        pg += '<a data-p="' + (S.page + 1) + '" title="Next" class="' + (S.page >= pages ? 'sms-disabled' : '') + '">&rsaquo;</a>';
        pg += '<a data-p="' + pages + '" title="Last" class="' + (S.page >= pages ? 'sms-disabled' : '') + '">&raquo;</a>';
        $("#sms_hist_pager").html(pg);
        $("#sms_hist_showing").text(total ? "Showing " + (start + 1) + " - " + (start + slice.length) + " of " + total + " records" : "Showing 0 of 0 records");
        $("#sms_hist_pageof").text("Page " + S.page + " / " + pages);
    }

    function mockExport(kind) {
        $("#sms_hist_msg").text("MOCK: " + kind + " export is a UI placeholder. No file was generated and nothing was sent.").show();
    }

    function openHistory() {
        if (!S.initiated) { return; }
        $("#sms_history_dialog").remove();
        var $d = $('<div id="sms_history_dialog" title="SMS Reminder History"></div>').html(modalHtml()).appendTo("body");
        var w = Math.min(1280, $(window).width() - 20);
        S.filtered = null; S.page = 1;
        $d.dialog({
            modal: true, width: w, maxHeight: Math.max(300, $(window).height() - 40), resizable: false, closeOnEscape: true,
            dialogClass: "sms-hist-dlg",
            close: function () { $d.dialog("destroy").remove(); }
        });
        $d.on("click", "#sms_f_search", applyFilters)
          .on("click", "#sms_f_reset", function () {
              $("#sms_f_loan,#sms_f_name,#sms_f_mobile,#sms_f_global").val(""); $("#sms_f_status").val("");
              $("#sms_hist_msg").hide(); S.filtered = null; S.page = 1; render();
          })
          .on("keypress", "#sms_hist_form input", function (e) { if (e.which === 13) { applyFilters(); } })
          .on("click", "#sms_f_xls", function () { mockExport("Excel"); })
          .on("click", "#sms_f_pdf", function () { mockExport("PDF"); })
          .on("click", "#sms_f_close", function () { $d.dialog("close"); })
          .on("click", "#sms_hist_pager a", function () {
              var p = parseInt($(this).attr("data-p"), 10), rows = S.filtered || S.rows || [],
                  pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
              if (p >= 1 && p <= pages) { S.page = p; render(); }
          });
        // Close when the overlay (outside the dialog) is clicked.
        $(".ui-widget-overlay").last().on("click", function () { $d.dialog("close"); });
        render();
    }

    // ---- Bind (idempotent) ---------------------------------------------------
    $(document).off("click.smsMock");
    $(document).on("click.smsMock", "#sms_send_btn", function () { sendReminder(); });
    $(document).on("click.smsMock", "#sms_history_btn", function () { openHistory(); });
    refreshButtons();
    if (S.initiated) { $("#sms_mock_feedback").text("MOCK: simulated session active. No SMS has been sent.").show(); }
})(window.jQuery);
</script>
