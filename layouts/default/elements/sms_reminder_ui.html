<?php
/*
 * SMS Reminder UI - MOCK ONLY (see sms/08_SMS_UI_SPECIFICATION.md)
 * ---------------------------------------------------------------
 * - Pure front-end markup/CSS/JS. No PHP logic, no DB access, no AJAX/fetch/XHR.
 * - Does NOT call sms::sendData() or any SMS provider. No message is ever sent.
 * - All rows shown are fabricated sample data (fake loan ids, fake names,
 *   fake 0000-series mobile numbers) and are labelled MOCK in the UI.
 * - Included once from layouts/default/summary_reports_stock_report.html.
 *   It may be re-included when the report tab reloads via AJAX, so the script
 *   keeps state on window.MfSmsMock and re-binds idempotently.
 */
?>
<style type="text/css">
.sms-mock-note { font-size: 11px; color: #8a4b00; background: #fff4e0; border: 1px solid #f0c987; border-radius: 4px; padding: 4px 8px; margin: 0 0 8px 0; }
.sms-mock-feedback { display: none; font-size: 12px; color: #383838; background: #eef6ee; border: 1px solid #b9d9b9; border-radius: 4px; padding: 5px 10px; margin: 6px 10px 6px 0; float: right; }
.sms-hist-filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; margin-bottom: 10px; }
.sms-hist-filters label { display: block; font-size: 11px; font-weight: bold; color: #383838; margin-bottom: 2px; }
.sms-hist-filters input[type=text], .sms-hist-filters select { font-size: 12px; padding: 3px 5px; min-width: 140px; max-width: 100%; box-sizing: border-box; }
.sms-hist-filters .greybtn { float: none; cursor: pointer; margin-right: 0; display: inline-block; }
.sms-hist-actions { margin-left: auto; display: flex; gap: 8px; }
.sms-hist-scroll { overflow-x: auto; }
.sms-hist-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.sms-hist-tbl th { background: #F0F0F0; text-align: left; padding: 6px; border: 1px solid #ddd; white-space: nowrap; }
.sms-hist-tbl td { padding: 6px; border: 1px solid #ddd; vertical-align: top; }
.sms-hist-empty { text-align: center; padding: 20px; color: #666; }
.sms-badge { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: bold; white-space: nowrap; }
.sms-badge-PENDING { background: #fff4e0; color: #8a4b00; }
.sms-badge-SUBMITTED { background: #e6f0fb; color: #1d4f8c; }
.sms-badge-FAILED { background: #fdeaea; color: #a12020; }
.sms-badge-SKIPPED { background: #eee; color: #555; }
.sms-hist-pager { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; }
.sms-hist-pager a { text-decoration: none; border: 1px solid #C7C7C7; border-radius: 4px; padding: 2px 8px; color: #383838; background: #DDDDDD; cursor: pointer; }
.sms-hist-pager a.sms-active { background: #383838; color: #fff; }
.sms-hist-pager a.sms-disabled { color: #A8A8A8; background: #eee; cursor: default; }
.sms-hist-pager .sms-count { margin-left: auto; color: #666; }
@media (max-width: 640px) {
    .sms-hist-filters > div { flex: 1 1 100%; }
    .sms-hist-filters input[type=text], .sms-hist-filters select { width: 100%; }
    .sms-hist-actions { margin-left: 0; }
}
</style>

<script type="text/javascript">
(function ($) {
    "use strict";

    // State survives re-inclusion of this partial (report tabs reload via AJAX).
    var S = window.MfSmsMock = window.MfSmsMock || { initiated: false, rows: null, page: 1, filtered: null, seq: 0 };
    var PAGE_SIZE = 5;
    var STATUSES = ["PENDING", "SUBMITTED", "FAILED", "SKIPPED"];

    // ---- MOCK DATA (fabricated; not read from the database) -------------------
    function seedRows() {
        var base = [
            ["MOCK-1001", "Sample Customer A", "0000000001", "SUBMITTED", "Simulated: handed to mock queue"],
            ["MOCK-1002", "Sample Customer B", "0000000002", "FAILED",    "Simulated: invalid mobile number"],
            ["MOCK-1003", "Sample Customer C", "0000000003", "PENDING",   "Simulated: waiting in mock queue"],
            ["MOCK-1004", "Sample Customer D", "0000000004", "SKIPPED",   "Simulated: no reminder due"],
            ["MOCK-1005", "Sample Customer E", "0000000005", "SUBMITTED", "Simulated: handed to mock queue"],
            ["MOCK-1006", "Sample Customer F", "0000000006", "FAILED",    "Simulated: gateway not connected (mock)"],
            ["MOCK-1007", "Sample Customer G", "0000000007", "PENDING",   "Simulated: waiting in mock queue"],
            ["MOCK-1008", "Sample Customer H", "0000000008", "SUBMITTED", "Simulated: handed to mock queue"]
        ];
        var rows = [], i, t = new Date();
        for (i = 0; i < base.length; i++) {
            rows.push(mk(base[i], new Date(t.getTime() - (i + 1) * 3600000)));
        }
        return rows;
    }
    function mk(b, created) {
        S.seq += 1;
        return { id: S.seq, loan: b[0], name: b[1], mobile: b[2], status: b[3], remarks: b[4], created: created, updated: created };
    }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function fmt(d) {
        return pad(d.getDate()) + "-" + pad(d.getMonth() + 1) + "-" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    function esc(s) { return $("<div/>").text(s).html(); }

    // ---- Buttons -----------------------------------------------------------
    function refreshButtons() {
        var $h = $("#sms_history_btn");
        if (S.initiated) {
            $h.removeClass("greybtn-off").addClass("greybtn").removeAttr("aria-disabled").attr("title", "Open SMS Reminder History (mock data)");
        } else {
            $h.removeClass("greybtn").addClass("greybtn-off").attr("aria-disabled", "true").attr("title", "Available after a reminder has been initiated");
        }
    }

    function sendReminder() {
        var $b = $("#sms_send_btn"), $f = $("#sms_mock_feedback");
        if ($b.data("busy")) { return; }
        $b.data("busy", true).css("opacity", 0.6);
        // History becomes available as soon as the action is initiated.
        S.initiated = true;
        if (!S.rows) { S.rows = seedRows(); }
        refreshButtons();
        $f.text("MOCK: reminder request in progress (simulated). No SMS is being sent.").show();
        window.setTimeout(function () {
            S.rows.unshift(mk(["MOCK-" + (2000 + S.seq), "Sample Customer " + S.seq, "00000" + pad(S.seq) + "00", "PENDING", "Simulated: queued by mock send action"], new Date()));
            $f.text("MOCK: simulated request recorded in History. No SMS was sent and no provider was contacted.");
            $b.data("busy", false).css("opacity", 1);
        }, 800);
    }

    // ---- History modal --------------------------------------------------------
    function modalHtml() {
        var opts = '<option value="">All</option>', i;
        for (i = 0; i < STATUSES.length; i++) { opts += '<option value="' + STATUSES[i] + '">' + STATUSES[i] + '</option>'; }
        return '' +
        '<div class="sms-mock-note"><strong>MOCK DATA</strong> &ndash; sample records for UI review only. Nothing here reflects real SMS delivery.</div>' +
        '<form id="sms_hist_form" onsubmit="return false;" autocomplete="off">' +
        '<div class="sms-hist-filters">' +
          '<div><label for="sms_f_loan">Loan ID</label><input type="text" id="sms_f_loan" maxlength="30"></div>' +
          '<div><label for="sms_f_name">Customer Name</label><input type="text" id="sms_f_name" maxlength="60"></div>' +
          '<div><label for="sms_f_mobile">Mobile Number</label><input type="text" id="sms_f_mobile" maxlength="15"></div>' +
          '<div><label for="sms_f_status">Status</label><select id="sms_f_status">' + opts + '</select></div>' +
          '<div><a href="javascript:;" class="greybtn" id="sms_f_search">Search</a> <a href="javascript:;" class="greybtn" id="sms_f_reset">Reset</a></div>' +
          '<div class="sms-hist-actions"><a href="javascript:;" class="greybtn" id="sms_f_xls">Excel</a> <a href="javascript:;" class="greybtn" id="sms_f_pdf">PDF</a></div>' +
        '</div></form>' +
        '<div id="sms_hist_msg" class="sms-mock-feedback" style="float:none;margin:0 0 8px 0;"></div>' +
        '<div class="sms-hist-scroll"><table class="sms-hist-tbl"><thead><tr>' +
          '<th>S.No</th><th>Loan ID</th><th>Customer Name</th><th>Mobile Number</th><th>Status</th><th>Remarks</th><th>Created</th><th>Updated</th>' +
        '</tr></thead><tbody id="sms_hist_body"></tbody></table></div>' +
        '<div class="sms-hist-pager" id="sms_hist_pager"></div>' +
        '<div style="text-align:right;margin-top:10px;"><a href="javascript:;" class="greybtn" id="sms_f_close" style="float:none;display:inline-block;margin-right:0;">Close</a></div>';
    }

    function applyFilters() {
        var loan = $.trim($("#sms_f_loan").val()).toLowerCase(),
            name = $.trim($("#sms_f_name").val()).toLowerCase(),
            mob = $.trim($("#sms_f_mobile").val()),
            st = $("#sms_f_status").val();
        S.filtered = $.grep(S.rows || [], function (r) {
            return (!loan || r.loan.toLowerCase().indexOf(loan) > -1) &&
                   (!name || r.name.toLowerCase().indexOf(name) > -1) &&
                   (!mob || r.mobile.indexOf(mob) > -1) &&
                   (!st || r.status === st);
        });
        S.page = 1;
        render();
    }

    function render() {
        var rows = S.filtered || S.rows || [], total = rows.length,
            pages = Math.max(1, Math.ceil(total / PAGE_SIZE)), i, html = "", start, slice, p, pg = "";
        if (S.page > pages) { S.page = pages; }
        start = (S.page - 1) * PAGE_SIZE;
        slice = rows.slice(start, start + PAGE_SIZE);
        if (!slice.length) {
            html = '<tr><td colspan="8" class="sms-hist-empty">No records found</td></tr>';
        }
        for (i = 0; i < slice.length; i++) {
            var r = slice[i];
            html += '<tr><td>' + (start + i + 1) + '</td><td>' + esc(r.loan) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.mobile) +
                '</td><td><span class="sms-badge sms-badge-' + r.status + '">' + r.status + '</span></td><td>' + esc(r.remarks) +
                '</td><td>' + fmt(r.created) + '</td><td>' + fmt(r.updated) + '</td></tr>';
        }
        $("#sms_hist_body").html(html);

        pg += '<a href="javascript:;" data-p="' + (S.page - 1) + '" class="' + (S.page <= 1 ? 'sms-disabled' : '') + '">&laquo; Prev</a>';
        for (p = 1; p <= pages; p++) {
            pg += '<a href="javascript:;" data-p="' + p + '" class="' + (p === S.page ? 'sms-active' : '') + '">' + p + '</a>';
        }
        pg += '<a href="javascript:;" data-p="' + (S.page + 1) + '" class="' + (S.page >= pages ? 'sms-disabled' : '') + '">Next &raquo;</a>';
        pg += '<span class="sms-count">' + total + ' record(s) &ndash; page ' + S.page + ' of ' + pages + '</span>';
        $("#sms_hist_pager").html(pg);
    }

    function mockExport(kind) {
        $("#sms_hist_msg").text("MOCK: " + kind + " export is a UI placeholder. No file was generated and nothing was sent.").show();
    }

    function openHistory() {
        if (!S.initiated) { return; }
        $("#sms_history_dialog").remove();
        var $d = $('<div id="sms_history_dialog" title="SMS Reminder History (MOCK)"></div>').html(modalHtml()).appendTo("body");
        var w = Math.min(1000, $(window).width() - 20);
        S.filtered = null; S.page = 1;
        $d.dialog({
            modal: true, width: w, maxHeight: Math.max(300, $(window).height() - 60), resizable: false, closeOnEscape: true,
            close: function () { $d.dialog("destroy").remove(); }
        });
        $d.on("click", "#sms_f_search", applyFilters)
          .on("click", "#sms_f_reset", function () {
              $("#sms_f_loan,#sms_f_name,#sms_f_mobile").val(""); $("#sms_f_status").val("");
              $("#sms_hist_msg").hide(); S.filtered = null; S.page = 1; render();
          })
          .on("keypress", "#sms_hist_form input", function (e) { if (e.which === 13) { applyFilters(); } })
          .on("click", "#sms_f_xls", function () { mockExport("Excel"); })
          .on("click", "#sms_f_pdf", function () { mockExport("PDF"); })
          .on("click", "#sms_f_close", function () { $d.dialog("close"); })
          .on("click", "#sms_hist_pager a", function () {
              var p = parseInt($(this).attr("data-p"), 10), rows = S.filtered || S.rows || [],
                  pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
              if (p >= 1 && p <= pages) { S.page = p; render(); }
          });
        // Close when the overlay (outside the dialog) is clicked.
        $(".ui-widget-overlay").last().on("click", function () { $d.dialog("close"); });
        render();
    }

    // ---- Bind (idempotent) ------------------------------------------------
    $(document).off("click.smsMock");
    $(document).on("click.smsMock", "#sms_send_btn", function () { sendReminder(); });
    $(document).on("click.smsMock", "#sms_history_btn", function () { openHistory(); });
    refreshButtons();
    if (S.initiated) { $("#sms_mock_feedback").text("MOCK: simulated session active. No SMS has been sent.").show(); }
})(window.jQuery);
</script>
