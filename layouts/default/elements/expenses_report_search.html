<script>
    jQuery(document).ready(function () {
        search_enter_action('<?php echo $module_name; ?>');

        // Preload sub-branches & sub-categories if search values exist
        var branch_id = "<?php echo $search_branch_id; ?>";
        var sub_branch_id = "<?php echo $search_sub_branch_id; ?>";
        var category_id = "<?php echo $search_category_id; ?>";
        var sub_category_id = "<?php echo $search_sub_category_id; ?>";

        if(branch_id !== "") {
            loadSubBranch(branch_id, sub_branch_id);
        }
        if(category_id !== "") {
            loadSubCategory(category_id, sub_category_id);
        }
    });

    function loadSubBranch(branch_id, selected_id = "") {
        if (typeof branch_id === "undefined" || branch_id === null) {
            branch_id = $("#branch_id").val();
        }
        if (branch_id !== "") {
            $.ajax({
                type: "POST",
                url: "expenses_report_dev.php",
                data: { action: "get_sub_branches", branch_id: branch_id },
                success: function (res) {
                    $("#sub_branch_id").html(res);
                    if (selected_id !== "") $("#sub_branch_id").val(selected_id);
                },
                error: function (xhr, status, err) {
                    console.error('AJAX error:', status, err);
                }
            });
        } else {
            $("#sub_branch_id").html("<option value=''>-- Select Sub Branch --</option>");
        }
    }

    function loadSubCategory(category_id, selected_id = "") {
        if (category_id !== "") {
            $.ajax({
                type: "POST",
                url: "expenses_report_dev.php",
                data: { action: "get_sub_categories", category_id: category_id },
                success: function (res) {
                    $("#sub_category_id").html(res);
                    if (selected_id !== "") $("#sub_category_id").val(selected_id);
                },
                error: function (xhr, status, err) {
                    console.error('AJAX error:', status, err);
                }
            });
        } else {
            $("#sub_category_id").html("<option value=''>-- Select Sub Category --</option>");
        }
    }
// Modal functions (already correct)
function show_modal(message) {
    $("#modal_msg").text(message);
    $("#modal_overlay, #modal_box").fadeIn(300);
}
function hide_modal() {
    $("#modal_overlay, #modal_box").fadeOut(300);
}
$("#modal_overlay, #modal_ok, #modal_close").click(function(){
    hide_modal();
});

function search_items() {
    var sdate = $("#sdate").val().trim();
    var edate = $("#edate").val().trim();
    var branch = $("#branch_id").val().trim();
    var sub_branch = $("#sub_branch_id").val().trim();
    var category = $("#category_id").val().trim();
    var sub_category = $("#sub_category_id").val().trim();

    var filledCount = 0;
    if (sdate) filledCount++;
    if (edate) filledCount++;
    if (branch) filledCount++;
    if (sub_branch) filledCount++;
    if (category) filledCount++;
    if (sub_category) filledCount++;

    if (filledCount === 6) {
        $("#search_form").submit();
    } else {
        show_modal("Please fill all 6 fields to search");
    }
}

// Button click event
$("#search_btn").click(function(){
    search_items();
});

</script>
