<script type="text/javascript">
$(document).ready(function(){
	$('#email_address').focus();
});
 
function forgot_password(div_id)   {

    var email_address = jQuery("#email_address").val();

    jQuery.ajax({
           type: "POST",
           url: "forgot_password.php?type=forgot_password",
           data:{
                "pval[email_address]" :email_address
           },
           success: function(msg){

                 result_data = msg.replace(/^[\s]+/g," ");
                 $("#msg").hide();
                 $("#msg").html(result_data);
                 $("#msg").fadeIn('slow');
                 
                 setTimeout(function () {
                     $("#msg").fadeOut(1000, function() {
                         $("#msg").html("");
                         $("#msg").fadeIn('slow');
                        });
                 }, 2000);

            }
         });
    return false;
}

</script>

</body>
