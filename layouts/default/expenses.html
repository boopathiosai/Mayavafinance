  <!-- JavaScript -->
  <script>
  // Edit Row
  function editRow(id) {
    create_function('content_div', '<?php echo $module_name; ?>', 'edit_id=' + id);
  }

  // Delete Row - FIXED VERSION
  function deleteRow(id) {
    if (!confirm("Are you sure you want to delete this record?")) return;

    $.ajax({
        url: "expenses.php",
        type: "POST",
        dataType: "json",
        data: { type: "delete", id: id },
        success: function(res) {
            console.log("Delete response:", res);
            
            if (res.status === true || res.success === true) {
                alert(res.content);
                
                // Remove the row from table immediately
                $("#row_" + id).fadeOut(300, function() {
                    $(this).remove();
                    // Also remove the expandable row
                    $("#expand_row_" + id).remove();
                    
                    // Check if no more rows left
                    if ($('tr[id^="row_"]').length === 0) {
                        $('tr#no_records_row').show();
                    }
                });
                
            } else {
                alert("Delete failed: " + res.content);
            }
        },
        error: function(xhr, status, err) {
            console.log("AJAX error:", err);
            console.log("Response text:", xhr.responseText);
            alert("AJAX error: " + err);
        }
    });
  }

  // Bulk Delete
  function delete_selected(div_id, module, page, search) {
    var selected = [];
    $('input[name="list[]"]:checked').each(function(){
      selected.push($(this).val());
    });
    
    if(selected.length === 0){
      alert("Please select items to delete");
      return false;
    }
    
    if(!confirm("Are you sure you want to delete " + selected.length + " selected item(s)?")) return false;
    
    $.ajax({
      url: "expenses.php",
      type: "POST",
      dataType: "json",
      data: { type: "delete", list: selected },
      success: function(res) {
        if (res.status === true) {
          alert(res.content);
          
          // Remove each deleted row
          if (res.deleted_ids && res.deleted_ids.length > 0) {
            res.deleted_ids.forEach(function(id) {
              $("#row_" + id).fadeOut(300, function() {
                $(this).remove();
                $("#expand_row_" + id).remove();
              });
            });
            
            // Check if no more rows left
            setTimeout(function() {
              if ($('tr[id^="row_"]').length === 0) {
                $('tr#no_records_row').show();
              }
            }, 350);
          }
        } else {
          alert("Delete failed: " + res.content);
        }
      }
    });
  }
  </script>
