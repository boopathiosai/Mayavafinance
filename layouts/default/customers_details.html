        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>
          $(document).ready(function() {
            $("#customers_code").on('input',function() {
              var searchText = $(this).val();
              $.ajax({
                type: "POST",
                data: "textbox1=" + searchText,
                url: "customers_details.php",
                dataType: 'JSON',
                success: function(response) {
                  if(response){
                    $('#customer_name').val(response[0]['name']);
                    $('#customer_mobile').val(response[0]['contact_no']);
                    console.log(response);
                  }
                  else{
                    $('#customer_name').val('-');
                    $('#customer_mobile').val('-');
                  }
                }        
              });
            });
            $(document).on("click", "#update_data", function() {
              $('.submit_save').attr('disabled',false)
             /*var customers_code_mandatory =  $('#customers_code').val();
             var customers_name_mandatory =  $('#customer_name').val();
             var customers_mobile_mandatory =  $('#customer_mobile').val();*/
             /*if(customers_code_mandatory == '' || customers_name_mandatory == ''){
              alert("Please enter customer code");
             }
             if(customers_mobile_mandatory!=10){
              alert("required 10 digits, match requested format!")
             }*/
              $.ajax({
                url: "customers_details.php",
                type: "POST",
                cache: false,
                data:{
                  customer_code: $('#customer_code').val(),
                  customer_name: $('#customer_name').val(),
                  customer_mobile: $('#customer_mobile').val(),
                },
                success: function(dataResult){
                  var dataResult = JSON.parse(dataResult);
                  if(dataResult.statusCode==200){
                    $('#update_country').modal().hide();
                    alert('Data updated successfully !');
                    location.reload();          
                  }
                }
              });
            }); 
          });
        </script>

<script src = "https://cdn.jsdelivr.net/npm/jquery-validation@1.19.2/dist/jquery.validate.min.js" > </script>
<script >
$(function () {
$("form[name='customers_details']").validate({
// Define validation rules
rules: {
customer_code: "required",
customer_name: "required",
customer_mobile: "required",
customer_code: {
required: true
},
customer_mobile: {
required: true,
minlength: 10,
maxlength: 10,
number: true
},
customer_name: {
required: true
}
},
// Specify validation error messages
messages: {
customer_code: "Please provide a customer code.",
customer_mobile: {
required: "Please provide a phone number",
minlength: "Phone number must be min 10 characters long",
maxlength: "Phone number must not be more than 10 characters long"
},
customer_name: "Please enter customer name."
},
submitHandler: function (form) {
form.submit();
}
});
}); 
</script>
